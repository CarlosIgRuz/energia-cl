name: CMg Coordinador
# Único workflow que usa la clave del Coordinador (así nunca hay dos corridas consultando a la vez).
# Cada corrida recorre los días pendientes desde ayer hacia atrás hasta el 15-jul-2024: primero recoge el día
# nuevo y después avanza el historial. 1 página cada 20 min (límite de la API), hasta ~5 h por corrida, con
# checkpoint. Ritmo medido que tolera la API: 1 página de 10.000 cada 20 min (~5,3 h por día de datos), así
# que estas 4 corridas diarias alcanzan para ~3,5 días de datos por día: el día nuevo + ~2,5 de historial.
on:
  schedule:
    - cron: "15 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      desde: { description: "Inicio del historial (YYYY-MM-DD)", default: "2024-07-15" }
      max_minutos: { description: "Presupuesto de la corrida (minutos)", default: "290" }
      sondeo: { description: "Correr antes el sondeo de endpoints (true/false)", default: "false" }

permissions:
  contents: write

concurrency: cen

jobs:
  cmg:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONPATH: src
      CEN_USER_KEY: ${{ secrets.CEN_USER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - name: Sondeo de endpoints
        if: inputs.sondeo == 'true' && env.CEN_USER_KEY != ''
        continue-on-error: true
        run: python -m energia.ingest.sondeo
      - name: Descargar días pendientes
        id: cmg
        if: env.CEN_USER_KEY != ''
        continue-on-error: true
        run: |
          python -m energia.ingest.cmg --desde ${{ inputs.desde || '2024-07-15' }} \
            --hasta $(TZ=America/Santiago date -d yesterday +%F) --orden desc \
            --intervalo-s 1200 --max-requests 200 --max-minutos ${{ inputs.max_minutos || '290' }}
      - name: Guardar datos y bitácora en el repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: CMg $(date -u +%F) [Fuente: Coordinador Eléctrico Nacional]"
          # Si no logra subir tras 3 intentos, falla en forma visible (antes los datos se perdían en silencio).
          for i in 1 2 3; do
            if git pull --rebase -q && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          echo "No se pudieron subir los datos"; exit 1
      - name: Marcar fallida si hubo error
        if: steps.cmg.outcome == 'failure'
        run: exit 1
