name: Ingesta diaria
# Fuentes sin clave. Cada noche a las 07:30 UTC (04:30 Chile en verano). Ejecución manual con fechas para backfill.
# El CMg del Coordinador va aparte en cmg.yml (único workflow que usa esa clave).
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      fuentes: { description: "Fuentes separadas por coma: clima, vertimiento, explorar_cmg, probar_sitio", default: "clima" }
      desde: { description: "Fecha inicio (YYYY-MM-DD), vacío = ayer", required: false }
      hasta: { description: "Fecha fin (YYYY-MM-DD), vacío = igual a desde", required: false }

permissions:
  contents: write

concurrency: ingesta

env:
  PYTHONPATH: src
  DESDE: ${{ inputs.desde }}
  HASTA: ${{ inputs.hasta }}

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests openpyxl
      - name: Fuentes de esta corrida
        id: f
        run: |
          F="${{ inputs.fuentes || 'clima' }}"
          echo "fuentes=,$F," >> "$GITHUB_OUTPUT"
          ARGS=""
          [ -n "$DESDE" ] && ARGS="$ARGS --desde $DESDE"
          [ -n "$HASTA" ] && ARGS="$ARGS --hasta $HASTA"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
      - name: Clima (Open-Meteo)
        id: clima
        if: contains(steps.f.outputs.fuentes, ',clima,')
        continue-on-error: true
        run: python -m energia.ingest.clima ${{ steps.f.outputs.args }}
      - name: Vertimiento mensual (Coordinador)
        id: vertimiento
        if: contains(steps.f.outputs.fuentes, ',vertimiento,')
        continue-on-error: true
        run: python -m energia.ingest.vertimiento
      - name: Exploración de los ZIP diarios de CMg del sitio del Coordinador
        id: explorar
        if: contains(steps.f.outputs.fuentes, ',explorar_cmg,')
        continue-on-error: true
        run: python -m energia.ingest.explorar_sitio
      - name: Prueba de acceso al sitio del Coordinador
        if: contains(steps.f.outputs.fuentes, ',probar_sitio,')
        continue-on-error: true
        run: python -m energia.ingest.probar_sitio
      - name: Guardar datos y bitácora en el repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: ingesta $(date -u +%F) [Fuentes: Open-Meteo.com; Coordinador Eléctrico Nacional]"
          # Si no logra subir tras 3 intentos, falla en forma visible (antes los datos se perdían en silencio).
          for i in 1 2 3; do
            if git pull --rebase -q && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          echo "No se pudieron subir los datos"; exit 1
      - name: Marcar la corrida como fallida si alguna fuente falló
        if: steps.clima.outcome == 'failure' || steps.vertimiento.outcome == 'failure' || steps.explorar.outcome == 'failure'
        run: exit 1
